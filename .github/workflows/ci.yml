name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Node regressions
        run: npm test
      - name: Official compatibility inventory
        run: npm run compatibility
      - name: Windows placement and notification regressions
        shell: pwsh
        run: |
          python -X utf8 scripts/verify-window-placement.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 scripts/verify-desktop-notifications.py
      - name: GitHub update network regressions
        # Host Java classes only; this does not build an APK.
        run: python -X utf8 scripts/verify-update-network.py
      - name: Scope
        shell: pwsh
        run: |
          'These are isolated regression checks. No official ChatGPT instance or Android device is available on this hosted runner.' >> $env:GITHUB_STEP_SUMMARY
